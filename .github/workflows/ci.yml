name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Install test browser
        if: runner.os == 'Linux' && matrix.node == '24'
        run: npx playwright install --with-deps chromium
      - name: Real-browser package smoke
        if: runner.os == 'Linux' && matrix.node == '24'
        run: npm run smoke:browser
